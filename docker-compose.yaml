services:
  social:
    build:
      context: .
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=social_media_api.settings.prod
    ports:
      - "8002:8000"
    depends_on:
      - db
    volumes:
      - ./:/app
      - my_media:/files/media

    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000"


  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - my_db:$PGDATA


  redis:
    image: "redis:alpine"


  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "celery -A social_media_api worker -l info"
    depends_on:
      - social
      - redis
      - db
    restart: on-failure
    env_file:
      - .env


  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "mkdir -p /tmp/celerybeat && 
      celery -A social_media_api beat -l info -s /tmp/celerybeat/schedule"
    depends_on:
      - social
      - redis
      - db
    restart: on-failure
    env_file:
      - .env


  flower:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    command: "celery -A social_media_api flower --address=0.0.0.0"
    depends_on:
      - celery
    env_file:
      - .env


volumes:
  my_db:
  my_media:
